name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (API key daalna)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: node scripts/inject-key.js index.html www/index.html

      - name: Install and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Aman Music app icon
        run: |
          cp -r icons/res/. android/app/src/main/res/
          echo "App icon lag gaya"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gr
