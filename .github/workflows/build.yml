name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (API key daalna)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          mkdir -p www
          node <<'EOF2'
          const fs = require("fs");
          const P = "__AMAN_API_KEY__";
          const key = (process.env.API_KEY || "").replace(/\s+/g, "");
          if (!key) {
            console.error("::error::API_KEY secret missing hai. Settings > Secrets and variables > Actions > Repository secrets mein naam API_KEY rakh kar key daalo.");
            process.exit(1);
          }
          let html = fs.readFileSync("index.html", "utf8");
          if (!html.includes(P)) { console.error("::error::placeholder index.html mein nahi mila"); process.exit(1); }
          const safe = JSON.stringify(key).slice(1, -1).replace(/</g, "\\u003c");
          html = html.split('"' + P + '"').join('"' + safe + '"');
          if (html.includes(P)) { console.error("::error::key andar nahi gayi"); process.exit(1); }
          fs.writeFileSync("www/index.html", html);
          console.log("API key app mein add ho gayi (length: " + key.length + ")");
          EOF2

      - name: Install and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Aman Music app icon
        run: |
          cp -r icons/res/. android/app/src/main/res/
          echo "App icon lag gaya"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aman-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
